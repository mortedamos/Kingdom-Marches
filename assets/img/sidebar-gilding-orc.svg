<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Orc: iron rule, plain triangles pointing inward like a row of teeth.
       Every triangle is filled orc red, so the kingdom color carries the
       whole frame rather than sitting on it as a stud. Mirrored, never
       rotated, so the teeth always point in at the content. -->
  <defs>
    <linearGradient id="mat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
      <stop offset="0" stop-color="#9a9088"/>
      <stop offset="1" stop-color="#2a2620"/>
    </linearGradient>

    <g id="tooth">
      <polygon points="-5,6 5,6 0,16" fill="#7a2e2e" stroke="#3a1414" stroke-width="0.7" stroke-linejoin="miter"/>
    </g>

    <g id="toothV">
      <polygon points="6,-5 6,5 16,0" fill="#7a2e2e" stroke="#3a1414" stroke-width="0.7" stroke-linejoin="miter"/>
    </g>

    <g id="corner">
      <polygon points="4.5,4.5 17.5,4.5 4.5,17.5" fill="#7a2e2e" stroke="#3a1414" stroke-width="0.8" stroke-linejoin="miter"/>
      <polygon points="7.5,7.5 13,7.5 7.5,13" fill="#2a2620"/>
    </g>

    <g id="edgeH">
      <use href="#tooth" transform="translate(9.33,0)"/>
      <use href="#tooth" transform="translate(28,0)"/>
      <use href="#tooth" transform="translate(46.67,0)"/>
    </g>
    <g id="edgeV">
      <use href="#toothV" transform="translate(0,9.33)"/>
      <use href="#toothV" transform="translate(0,28)"/>
      <use href="#toothV" transform="translate(0,46.67)"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#mat)" stroke-width="1.4">
    <path d="M0,3.5 L96,3.5"/>
    <path d="M0,92.5 L96,92.5"/>
    <path d="M3.5,0 L3.5,96"/>
    <path d="M92.5,0 L92.5,96"/>
  </g>

  <use href="#corner"/>
  <use href="#corner" transform="translate(96,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,96) scale(1,-1)"/>
  <use href="#corner" transform="translate(96,96) scale(-1,-1)"/>

  <use href="#edgeH" transform="translate(20,0)"/>
  <use href="#edgeH" transform="translate(20,96) scale(1,-1)"/>
  <use href="#edgeV" transform="translate(0,20)"/>
  <use href="#edgeV" transform="translate(96,20) scale(-1,1)"/>
</svg>
