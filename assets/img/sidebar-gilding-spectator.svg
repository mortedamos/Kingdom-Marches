<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- AI Spectator: silver rule, plain squares. The quietest frame of the
       set, since the watcher claims no kingdom: an open square bracket at
       each corner, small filled squares along the edges, and no colour but
       the neutral silver-blue. Mirrored on both axes; no rotation. -->
  <defs>
    <linearGradient id="mat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
      <stop offset="0" stop-color="#d4dee8"/>
      <stop offset="1" stop-color="#4a5668"/>
    </linearGradient>

    <g id="sq">
      <rect x="-3.6" y="-3.6" width="7.2" height="7.2" fill="#7d93a8" stroke="#2e3844" stroke-width="0.6"/>
    </g>

    <g id="corner">
      <rect x="5" y="5" width="12" height="12" fill="none" stroke="url(#mat)" stroke-width="1.4"/>
      <rect x="8.6" y="8.6" width="4.8" height="4.8" fill="#7d93a8" stroke="#2e3844" stroke-width="0.6"/>
    </g>

    <g id="edgeH">
      <use href="#sq" transform="translate(9.33,11)"/>
      <use href="#sq" transform="translate(28,11)"/>
      <use href="#sq" transform="translate(46.67,11)"/>
    </g>
    <g id="edgeV">
      <use href="#sq" transform="translate(11,9.33)"/>
      <use href="#sq" transform="translate(11,28)"/>
      <use href="#sq" transform="translate(11,46.67)"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#mat)" stroke-width="1.4">
    <path d="M0,3.5 L96,3.5"/>
    <path d="M0,92.5 L96,92.5"/>
    <path d="M3.5,0 L3.5,96"/>
    <path d="M92.5,0 L92.5,96"/>
  </g>

  <use href="#corner"/>
  <use href="#corner" transform="translate(96,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,96) scale(1,-1)"/>
  <use href="#corner" transform="translate(96,96) scale(-1,-1)"/>

  <use href="#edgeH" transform="translate(20,0)"/>
  <use href="#edgeH" transform="translate(20,96) scale(1,-1)"/>
  <use href="#edgeV" transform="translate(0,20)"/>
  <use href="#edgeV" transform="translate(96,20) scale(-1,1)"/>
</svg>
