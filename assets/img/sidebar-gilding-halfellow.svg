<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Halfellow: gold rule, plain amber discs. Halfellow's own color is
       already the UI gold, so the frame leans on the warm amber fill and
       the roundness of the motif to set it apart from the angular
       kingdoms. Mirrored on both axes; no rotation. -->
  <defs>
    <linearGradient id="mat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
      <stop offset="0" stop-color="#f2d998"/>
      <stop offset="1" stop-color="#8a6d2f"/>
    </linearGradient>

    <g id="disc">
      <circle cx="0" cy="0" r="4.4" fill="#e6a640" stroke="#8a5a1c" stroke-width="0.7"/>
    </g>

    <g id="corner">
      <circle cx="11" cy="11" r="6.2" fill="none" stroke="url(#mat)" stroke-width="1.4"/>
      <circle cx="11" cy="11" r="4.4" fill="#e6a640" stroke="#8a5a1c" stroke-width="0.7"/>
    </g>

    <g id="edgeH">
      <use href="#disc" transform="translate(9.33,11)"/>
      <use href="#disc" transform="translate(28,11)"/>
      <use href="#disc" transform="translate(46.67,11)"/>
    </g>
    <g id="edgeV">
      <use href="#disc" transform="translate(11,9.33)"/>
      <use href="#disc" transform="translate(11,28)"/>
      <use href="#disc" transform="translate(11,46.67)"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#mat)" stroke-width="1.4">
    <path d="M0,3.5 L96,3.5"/>
    <path d="M0,92.5 L96,92.5"/>
    <path d="M3.5,0 L3.5,96"/>
    <path d="M92.5,0 L92.5,96"/>
  </g>

  <use href="#corner"/>
  <use href="#corner" transform="translate(96,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,96) scale(1,-1)"/>
  <use href="#corner" transform="translate(96,96) scale(-1,-1)"/>

  <use href="#edgeH" transform="translate(20,0)"/>
  <use href="#edgeH" transform="translate(20,96) scale(1,-1)"/>
  <use href="#edgeV" transform="translate(0,20)"/>
  <use href="#edgeV" transform="translate(96,20) scale(-1,1)"/>
</svg>
