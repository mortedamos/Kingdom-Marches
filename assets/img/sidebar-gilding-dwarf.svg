<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Dwarf: bronze rule, plain hexagons. The hexagon is the entire motif.
       Frame material is dwarf bronze throughout, so the kingdom color is
       the frame rather than a stud on it. Mirrored, never rotated. -->
  <defs>
    <linearGradient id="mat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
      <stop offset="0" stop-color="#d9b988"/>
      <stop offset="1" stop-color="#5c4630"/>
    </linearGradient>

    <g id="hex">
      <polygon points="0,-5 4.4,-2.5 4.4,2.5 0,5 -4.4,2.5 -4.4,-2.5"
               fill="url(#mat)" stroke="#3a2c1c" stroke-width="0.7"/>
    </g>

    <g id="corner">
      <polygon points="11,4.5 16.6,7.75 16.6,14.25 11,17.5 5.4,14.25 5.4,7.75"
               fill="url(#mat)" stroke="#3a2c1c" stroke-width="0.8"/>
      <polygon points="11,8 13.6,9.5 13.6,12.5 11,14 8.4,12.5 8.4,9.5" fill="#2a2118"/>
    </g>

    <g id="edgeH">
      <use href="#hex" transform="translate(9.33,11)"/>
      <use href="#hex" transform="translate(28,11)"/>
      <use href="#hex" transform="translate(46.67,11)"/>
    </g>
    <g id="edgeV">
      <use href="#hex" transform="translate(11,9.33)"/>
      <use href="#hex" transform="translate(11,28)"/>
      <use href="#hex" transform="translate(11,46.67)"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#mat)" stroke-width="1.4">
    <path d="M0,3.5 L96,3.5"/>
    <path d="M0,92.5 L96,92.5"/>
    <path d="M3.5,0 L3.5,96"/>
    <path d="M92.5,0 L92.5,96"/>
  </g>

  <use href="#corner"/>
  <use href="#corner" transform="translate(96,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,96) scale(1,-1)"/>
  <use href="#corner" transform="translate(96,96) scale(-1,-1)"/>

  <use href="#edgeH" transform="translate(20,0)"/>
  <use href="#edgeH" transform="translate(20,96) scale(1,-1)"/>
  <use href="#edgeV" transform="translate(0,20)"/>
  <use href="#edgeV" transform="translate(96,20) scale(-1,1)"/>
</svg>
