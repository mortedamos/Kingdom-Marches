<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Human: a plain gold rule studded with purple lozenges. The lozenge
       is the whole motif; nothing else competes with it. Every ornament is
       placed by translation or reflection only, so the frame is mirror
       symmetric on both axes and nothing is ever rotated. -->
  <defs>
    <linearGradient id="mat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
      <stop offset="0" stop-color="#e8ce8c"/>
      <stop offset="1" stop-color="#9c7c34"/>
    </linearGradient>

    <g id="dia">
      <polygon points="0,-4.6 4,0 0,4.6 -4,0" fill="#8e44ad" stroke="#4a2360" stroke-width="0.6"/>
    </g>

    <g id="corner">
      <polygon points="11,3.5 18.5,11 11,18.5 3.5,11" fill="#8e44ad" stroke="#4a2360" stroke-width="0.7"/>
      <polygon points="11,7 15,11 11,15 7,11" fill="#e8ce8c"/>
    </g>

    <g id="edgeH">
      <use href="#dia" transform="translate(9.33,11)"/>
      <use href="#dia" transform="translate(28,11)"/>
      <use href="#dia" transform="translate(46.67,11)"/>
    </g>
    <g id="edgeV">
      <use href="#dia" transform="translate(11,9.33)"/>
      <use href="#dia" transform="translate(11,28)"/>
      <use href="#dia" transform="translate(11,46.67)"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#mat)" stroke-width="1.4">
    <path d="M0,3.5 L96,3.5"/>
    <path d="M0,92.5 L96,92.5"/>
    <path d="M3.5,0 L3.5,96"/>
    <path d="M92.5,0 L92.5,96"/>
  </g>

  <use href="#corner"/>
  <use href="#corner" transform="translate(96,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,96) scale(1,-1)"/>
  <use href="#corner" transform="translate(96,96) scale(-1,-1)"/>

  <use href="#edgeH" transform="translate(20,0)"/>
  <use href="#edgeH" transform="translate(20,96) scale(1,-1)"/>
  <use href="#edgeV" transform="translate(0,20)"/>
  <use href="#edgeV" transform="translate(96,20) scale(-1,1)"/>
</svg>
