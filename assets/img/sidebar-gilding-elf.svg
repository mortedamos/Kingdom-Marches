<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
  <!-- Elf: two bark-brown zigzags running against each other form a woven
       lattice. The weave IS the motif, so the leaves are reduced to single
       green diamonds sitting in every other opening. Mirror symmetric on
       both axes; no rotation anywhere. -->
  <defs>
    <linearGradient id="mat" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="96">
      <stop offset="0" stop-color="#c2a273"/>
      <stop offset="1" stop-color="#5c3f22"/>
    </linearGradient>

    <g id="leaf">
      <polygon points="0,-4 3.4,0 0,4 -3.4,0" fill="#3f8f5c" stroke="#234d33" stroke-width="0.6"/>
    </g>

    <g id="corner">
      <polygon points="11,4 18,11 11,18 4,11" fill="none" stroke="url(#mat)" stroke-width="1.4"/>
      <use href="#leaf" transform="translate(11,11) scale(1.15)"/>
    </g>

    <g id="edgeH">
      <path d="M0,7 L7,15 L14,7 L21,15 L28,7 L35,15 L42,7 L49,15 L56,7"
            fill="none" stroke="url(#mat)" stroke-width="1.3"/>
      <path d="M0,15 L7,7 L14,15 L21,7 L28,15 L35,7 L42,15 L49,7 L56,15"
            fill="none" stroke="#4a3018" stroke-width="1.3"/>
      <use href="#leaf" transform="translate(7,11)"/>
      <use href="#leaf" transform="translate(35,11)"/>
    </g>

    <g id="edgeV">
      <path d="M7,0 L15,7 L7,14 L15,21 L7,28 L15,35 L7,42 L15,49 L7,56"
            fill="none" stroke="url(#mat)" stroke-width="1.3"/>
      <path d="M15,0 L7,7 L15,14 L7,21 L15,28 L7,35 L15,42 L7,49 L15,56"
            fill="none" stroke="#4a3018" stroke-width="1.3"/>
      <use href="#leaf" transform="translate(11,7)"/>
      <use href="#leaf" transform="translate(11,35)"/>
    </g>
  </defs>

  <g fill="none" stroke="url(#mat)" stroke-width="1.4">
    <path d="M0,3.5 L96,3.5"/>
    <path d="M0,92.5 L96,92.5"/>
    <path d="M3.5,0 L3.5,96"/>
    <path d="M92.5,0 L92.5,96"/>
  </g>

  <use href="#corner"/>
  <use href="#corner" transform="translate(96,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,96) scale(1,-1)"/>
  <use href="#corner" transform="translate(96,96) scale(-1,-1)"/>

  <use href="#edgeH" transform="translate(20,0)"/>
  <use href="#edgeH" transform="translate(20,96) scale(1,-1)"/>
  <use href="#edgeV" transform="translate(0,20)"/>
  <use href="#edgeV" transform="translate(96,20) scale(-1,1)"/>
</svg>
