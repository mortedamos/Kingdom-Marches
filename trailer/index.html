<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kingdom Marches Trailer</title>
<style>
  @font-face {
    font-family: "Cinzel";
    src: url("../assets/fonts/cinzel-latin-variable.woff2") format("woff2");
    font-weight: 400 900;
  }
  html, body { margin: 0; height: 100%; background: #07060a; color: #e9dcc0; font-family: Georgia, serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; box-sizing: border-box; }
  #stage { width: min(100%, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; box-shadow: 0 0 40px #000; }
  canvas { width: 100%; height: 100%; display: block; }
  #bar { display: flex; gap: 10px; align-items: center; width: min(100%, calc((100vh - 110px) * 16 / 9)); flex-wrap: wrap; }
  button { font-family: "Cinzel", Georgia, serif; font-weight: 700; background: #2a1f14; color: #f0d890; border: 1px solid #8a6a2c; border-radius: 4px; padding: 6px 14px; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #scrub { flex: 1; min-width: 160px; accent-color: #c9a857; }
  #time { font-variant-numeric: tabular-nums; min-width: 4.5em; text-align: right; }
  #status { font-size: 13px; opacity: .8; width: 100%; }
</style>
</head>
<body>
  <div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
  <div id="bar">
    <button id="play" disabled>Loading…</button>
    <input id="scrub" type="range" min="0" max="60" step="0.01" value="0">
    <span id="time">0.00</span>
    <button id="render" disabled title="Needs trailer/capture-server.pl">Render MP4</button>
    <div id="status"></div>
  </div>
  <script src="trailer.js"></script>
</body>
</html>
